<title>Astral Commonplace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: an observatory desk at night. A star chart behind, one inscription field, then a feed of index cards. */
:root{
  --night:#0d1020;        /* midnight ink */
  --night-2:#151a2e;      /* card ground */
  --night-3:#1d2340;      /* raised / hover */
  --parchment:#eadfc6;    /* body text */
  --dim:#a39a86;          /* secondary text */
  --brass:#c9a45c;        /* accent: brass instruments, gilt */
  --brass-dim:#8a7444;
  --oxblood:#8c3a4a;      /* wax seal, warnings */
  --verdigris:#6f9b8c;    /* tags */
  --rule:rgba(201,164,92,.22);
  --display:"IM Fell English","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Spectral","Iowan Old Style",Georgia,serif;
  --label:"Cinzel","Trajan Pro","Times New Roman",serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--night);color:var(--parchment);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 120px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* Masthead */
.mast{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:18px}
.mast h1{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,6vw,3.4rem);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.mast h1 i{color:var(--brass)}
.tagline{font-style:italic;color:var(--dim);margin:6px 0 0}
.ephemeris{display:flex;gap:14px;align-items:center;font-family:var(--label);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ephemeris strong{display:block;color:var(--parchment);font-weight:500;letter-spacing:.1em}
.ephemeris svg{flex:none}

/* Inscription */
.inscribe{margin-top:26px;background:linear-gradient(180deg,rgba(29,35,64,.92),rgba(21,26,46,.92));border:1px solid var(--rule);border-radius:4px;padding:16px 16px 12px;box-shadow:0 0 0 4px rgba(13,16,32,.6),0 18px 40px -20px #000}
.inscribe label{font-family:var(--label);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
#entry{display:block;width:100%;box-sizing:border-box;margin-top:8px;min-height:64px;resize:vertical;background:transparent;border:0;border-bottom:1px dashed var(--rule);padding:4px 0 10px;font-family:var(--display);font-size:1.3rem;line-height:1.4;color:var(--parchment)}
#entry::placeholder{color:#6f6a60;font-style:italic}
#entry:focus{outline:none;border-bottom-color:var(--brass)}
.inscribe-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:10px}
.hints{display:flex;flex-wrap:wrap;gap:6px}
.hint{background:none;border:1px solid var(--rule);color:var(--dim);border-radius:999px;padding:3px 10px;font-size:.82rem}
.hint:hover{color:var(--parchment);border-color:var(--brass-dim)}
.hint code{font-family:var(--body);color:var(--verdigris)}
.btn{background:var(--brass);color:#1a1408;border:0;border-radius:3px;padding:8px 18px;font-family:var(--label);font-weight:600;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase}
.btn:hover{background:#d8b56c}
.btn.ghost{background:none;color:var(--brass);border:1px solid var(--brass-dim)}
.btn.ghost:hover{background:rgba(201,164,92,.1)}
.btn.danger{background:none;color:#d98a98;border:1px solid var(--oxblood)}
.preview{margin-top:8px;font-size:.85rem;color:var(--dim);min-height:1.3em;font-style:italic}
.preview b{color:var(--brass);font-style:normal;font-weight:500}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:26px}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;box-sizing:border-box;background:rgba(13,16,32,.7);border:1px solid var(--rule);border-radius:3px;padding:8px 12px 8px 34px;color:var(--parchment)}
.search input:focus{outline:none;border-color:var(--brass-dim)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.6}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;font-family:var(--label);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--brass);color:#1a1408}
.tags{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;background:none;border:1px solid rgba(111,155,140,.4);color:var(--verdigris);border-radius:2px;padding:3px 10px;font-family:var(--label);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--verdigris);color:var(--night);border-color:var(--verdigris)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.status{font-size:.78rem;color:var(--dim);margin-left:auto;font-style:italic}

/* Feed */
.feed{margin-top:18px;columns:3 300px;column-gap:16px}
.card{break-inside:avoid;margin:0 0 16px;background:var(--night-2);border:1px solid var(--rule);border-radius:3px;padding:14px 16px 12px;position:relative;cursor:pointer;transition:background .15s,border-color .15s}
.card:hover{background:var(--night-3);border-color:rgba(201,164,92,.4)}
.card.pinned{border-color:var(--brass-dim);box-shadow:inset 0 2px 0 var(--brass)}
.card.example{opacity:.62;border-style:dashed;cursor:default}
.card .eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--label);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.card .eyebrow .sp{flex:1}
.card .text{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.card .text a{color:var(--brass);text-decoration-color:var(--brass-dim)}
.card h3{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:6px 0 4px;text-transform:capitalize}
.card .when{font-family:var(--display);font-size:1.45rem;margin:6px 0 2px;color:var(--parchment)}
.card .when.sent{text-decoration:line-through;text-decoration-color:var(--oxblood);color:var(--dim)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;font-size:.78rem;color:var(--dim)}
.card .meta .tag{color:var(--verdigris);font-family:var(--label);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase}
.card .meta .date{margin-left:auto;display:inline-flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums}
.linkbox{display:block;margin-top:8px;border:1px solid var(--rule);border-radius:2px;padding:8px 10px;background:rgba(13,16,32,.5);color:var(--parchment);text-decoration:none;overflow-wrap:anywhere;font-size:.88rem}
.linkbox span{display:block;font-family:var(--label);font-size:.6rem;letter-spacing:.16em;color:var(--brass);text-transform:uppercase}
.items{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.items label{display:flex;gap:10px;align-items:flex-start;padding:3px 0;cursor:pointer}
.items input{appearance:none;flex:none;width:15px;height:15px;margin-top:4px;border:1px solid var(--brass-dim);border-radius:50%;display:grid;place-content:center}
.items input:checked{background:var(--brass);border-color:var(--brass)}
.items input:checked::after{content:"";width:5px;height:5px;background:var(--night);border-radius:50%}
.items .done{color:var(--dim);text-decoration:line-through}
.additem{display:flex;gap:6px;margin-top:6px}
.additem input{flex:1;min-width:0;background:none;border:0;border-bottom:1px dashed var(--rule);padding:3px 0;font-size:.9rem}
.additem input:focus{outline:none;border-color:var(--brass)}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);font-style:italic;padding:28px 0 10px}
.empty b{display:block;font-family:var(--display);font-style:normal;font-weight:400;font-size:1.5rem;color:var(--parchment)}

/* Board (constellations) */
.board{margin-top:18px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:16px;overflow-x:auto;padding-bottom:10px}
.board .col{min-width:0}
.board .col h2{font-family:var(--label);font-weight:500;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--verdigris);border-bottom:1px solid var(--rule);padding-bottom:8px;margin:0 0 12px;display:flex;justify-content:space-between}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,7,15,.72);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;box-sizing:border-box;background:var(--night-2);border:1px solid var(--brass-dim);border-radius:6px 6px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.sheet{border-radius:6px}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0 0 4px}
.sheet .sub{color:var(--dim);font-size:.85rem;margin:0 0 12px;font-style:italic}
.sheet textarea,.sheet input[type=text]{width:100%;box-sizing:border-box;background:rgba(13,16,32,.6);border:1px solid var(--rule);border-radius:3px;padding:10px;color:var(--parchment)}
.sheet textarea{min-height:120px;resize:vertical}
.sheet .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sheet .row .sp{flex:1}
.answer{margin-top:14px;white-space:pre-wrap;border-left:2px solid var(--brass);padding-left:12px;min-height:1.5em}
.cheats{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.cheats li{border-bottom:1px solid var(--rule);padding-bottom:10px}
.cheats code{font-family:var(--display);font-size:1.05rem;color:var(--brass)}
.cheats p{margin:2px 0 0;color:var(--dim);font-size:.9rem}

/* Toasts */
.toasts{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;justify-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.toast{pointer-events:auto;max-width:520px;background:var(--night-3);border:1px solid var(--brass);border-radius:4px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px -10px #000}
.toast.bell{border-color:var(--brass);background:linear-gradient(90deg,rgba(140,58,74,.35),var(--night-3))}
.toast button{background:none;border:0;color:var(--brass);font-family:var(--label);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase}
footer{margin-top:40px;color:var(--dim);font-size:.8rem;text-align:center;font-style:italic}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="mast">
    <div>
      <h1>Astral <i>Commonplace</i></h1>
      <p class="tagline">For minds that keep turning after the candles are out.</p>
    </div>
    <div class="ephemeris" id="ephemeris"></div>
  </header>

  <section class="inscribe" aria-label="Write something down">
    <label for="entry">Inscribe a thought</label>
    <textarea id="entry" rows="2" placeholder="An idea, a link, a list, a reminder&hellip;"></textarea>
    <div class="preview" id="preview" aria-live="polite"></div>
    <div class="inscribe-row">
      <div class="hints" id="hints">
        <button class="hint" type="button" data-ins=" #reading">tag it <code>#reading</code></button>
        <button class="hint" type="button" data-ins="#groceries ">list <code>#groceries eggs, tea</code></button>
        <button class="hint" type="button" data-ins="remind me to  at 3pm">reminder <code>remind me … at 3pm</code></button>
        <button class="hint" type="button" data-ins=" #pin">pin <code>#pin</code></button>
      </div>
      <button class="btn" id="save" type="button">Inscribe</button>
    </div>
  </section>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="#c9a45c" stroke-width="1.4"/><path d="M11 11l3.5 3.5" stroke="#c9a45c" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search the archive" aria-label="Search notes">
    </div>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="feed" aria-pressed="true">Feed</button>
      <button type="button" data-view="board" aria-pressed="false">Constellations</button>
      <button type="button" data-view="vault" aria-pressed="false">Vault</button>
    </div>
    <button class="btn ghost" id="oracleBtn" type="button">Ask the oracle</button>
    <button class="btn ghost" id="moreBtn" type="button" aria-label="Guide and export">Almanac</button>
  </div>
  <div class="tags" id="tags" role="group" aria-label="Filter by tag"></div>
  <div class="status" id="status"></div>

  <main id="out"></main>
  <footer>Reminders chime while this page is open. Your entries are private to you.</footer>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const S = { notes: [], q: '', tag: null, view: 'feed', store: null, ready: false };

/* ---------- Moon ---------- */
function moonPhase(t){ // 0 new → .5 full → 1
  const syn = 29.530588853, ref = Date.UTC(2000,0,6,18,14);
  let p = ((t - ref) / 864e5 / syn) % 1; if (p < 0) p += 1; return p;
}
function phaseName(p){
  const n = ['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];
  return n[Math.floor((p * 8 + .5)) % 8];
}
function moonSVG(p, size){
  const r = size/2 - 1, c = size/2;
  const rx = Math.abs(r * Math.cos(2*Math.PI*p));
  const outer = p < .5 ? 1 : 0;
  const term = (p < .25 || (p >= .5 && p < .75)) ? 0 : 1;
  const lit = (p < .02 || p > .98) ? '' :
    `<path d="M${c} ${c-r} A${r} ${r} 0 0 ${outer} ${c} ${c+r} A${rx.toFixed(2)} ${r} 0 0 ${term} ${c} ${c-r}Z" fill="#eadfc6"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="#262c4a" stroke="#8a7444" stroke-width=".8"/>${lit}</svg>`;
}
function renderEphemeris(){
  const now = new Date(), p = moonPhase(now.getTime());
  const illum = Math.round((1 - Math.cos(2*Math.PI*p)) / 2 * 100);
  const date = now.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });
  $('#ephemeris').innerHTML = `${moonSVG(p, 44)}<div><strong>${esc(date)}</strong>${phaseName(p)} · ${illum}% lit</div>`;
}

/* ---------- Parsing ---------- */
const clean = s => s.replace(/\s{2,}/g,' ').replace(/\s+([,.;!?])/g,'$1').replace(/(^|\s)(at|on|by|to)\s*$/i,'').replace(/^[\s,.;:-]+|[\s,;:-]+$/g,'').replace(/^to\s+/i,'').trim();
function nextOccurrence(rep, from){
  const d = new Date(from);
  if (rep.type === 'daily'){ d.setHours(rep.hh, rep.mm, 0, 0); if (d <= from) d.setDate(d.getDate()+1); return d; }
  if (rep.type === 'weekly'){ d.setHours(rep.hh, rep.mm, 0, 0); d.setDate(d.getDate() + (rep.dow - d.getDay() + 7) % 7); if (d <= from) d.setDate(d.getDate()+7); return d; }
  const mk = (y,m) => new Date(y, m, Math.min(rep.dom, new Date(y, m+1, 0).getDate()), rep.hh, rep.mm);
  let x = mk(from.getFullYear(), from.getMonth()); if (x <= from) x = mk(from.getFullYear(), from.getMonth()+1); return x;
}
function parseWhen(s, now){
  let body = s.replace(/^\s*remind me\s*(?:to\s+)?/i,'');
  const take = re => { const m = body.match(re); if (m) body = body.replace(m[0], ' '); return m; };
  let m = take(/\bin\s+(\d+)\s*(minutes?|mins?|hours?|hrs?|days?)\b/i);
  if (m){ const u = m[2][0].toLowerCase(); return { due: now.getTime() + (+m[1]) * (u==='m'?6e4:u==='h'?36e5:864e5), repeat:null, body: clean(body) }; }
  let hh = null, mm = 0, repeat = null, dayFixed = false;
  if ((m = take(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i))){ hh = (+m[1] % 12) + (m[3].toLowerCase()==='pm' ? 12 : 0); mm = +(m[2]||0); }
  else if ((m = take(/\bat\s+(\d{1,2}):(\d{2})\b/i))){ hh = +m[1]; mm = +m[2]; }
  else if (take(/\b(?:at\s+)?noon\b/i)) hh = 12;
  if (take(/\b(?:every\s*day|daily)\b/i)) repeat = { type:'daily' };
  else if ((m = take(/\bevery\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i))) repeat = { type:'weekly', dow: DAYS.indexOf(m[1].toLowerCase()) };
  else if ((m = take(/\bevery\s+month\s+on\s+the\s+(\d{1,2})(?:st|nd|rd|th)?\b/i))) repeat = { type:'monthly', dom: Math.min(31, +m[1]) };
  const base = new Date(now);
  if (!repeat){
    if (take(/\btomorrow\b/i)){ base.setDate(base.getDate()+1); dayFixed = true; }
    else if ((m = take(/\btonight\b/i))){ dayFixed = true; if (hh === null) hh = 20; else if (hh < 12) hh += 12; }
    else if (take(/\btoday\b/i)) dayFixed = true;
    else if ((m = take(/\b(?:on\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i))){
      let diff = (DAYS.indexOf(m[1].toLowerCase()) - base.getDay() + 7) % 7; if (diff === 0) diff = 7;
      base.setDate(base.getDate() + diff); dayFixed = true;
    }
  }
  if (hh === null && !dayFixed && !repeat) return null;
  if (hh === null) hh = 9;
  if (repeat){ repeat.hh = hh; repeat.mm = mm; return { due: nextOccurrence(repeat, now).getTime(), repeat, body: clean(body) }; }
  base.setHours(hh, mm, 0, 0);
  if (!dayFixed && base <= now) base.setDate(base.getDate()+1);
  return { due: base.getTime(), repeat: null, body: clean(body) };
}
function parse(raw, now = new Date()){
  let text = raw.trim(); if (!text) return null;
  const lead = text.match(/^#([A-Za-z][\w-]*)\s+([\s\S]+)$/);
  if (lead && lead[1].toLowerCase() !== 'pin'){
    const items = lead[2].split(/,|\n/).map(s => s.trim()).filter(Boolean);
    return { kind:'list', name: lead[1].toLowerCase(), items };
  }
  const tags = []; let pinned = false;
  text = text.replace(/(^|\s)#([A-Za-z][\w-]*)/g, (_, sp, t) => { t = t.toLowerCase(); if (t === 'pin') pinned = true; else if (!tags.includes(t)) tags.push(t); return sp; }).replace(/[ \t]{2,}/g,' ').trim();
  if (/^\s*remind me\b/i.test(text)){
    const w = parseWhen(text, now);
    if (w && w.body) return { kind:'reminder', text: w.body, due: w.due, repeat: w.repeat, tags, pinned };
    return { kind:'note', text, tags, pinned, warn:'Couldn’t read a time, so it’s kept as a note. Try “at 3pm”, “tomorrow at 9am” or “in 20 minutes”.' };
  }
  const url = (text.match(/https?:\/\/[^\s<>"]+/i) || [])[0];
  if (url) return { kind:'link', text, url, tags, pinned };
  return { kind:'note', text, tags, pinned };
}

/* ---------- Formatting ---------- */
const fmtWhen = t => {
  const d = new Date(t), now = new Date();
  const same = (a,b) => a.toDateString() === b.toDateString();
  const tm = d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
  if (same(d, now)) return 'Today, ' + tm;
  const tmr = new Date(now); tmr.setDate(tmr.getDate()+1);
  if (same(d, tmr)) return 'Tomorrow, ' + tm;
  return d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' }) + ', ' + tm;
};
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { day:'numeric', month:'short' }) + ' · ' + new Date(t).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
const repLabel = r => !r ? '' : r.type === 'daily' ? 'Every day' : r.type === 'weekly' ? 'Every ' + DAYS[r.dow][0].toUpperCase() + DAYS[r.dow].slice(1) : 'Monthly on the ' + r.dom + ([,'st','nd','rd'][r.dom % 10 > 3 || ~~(r.dom/10) === 1 ? 0 : r.dom % 10] || 'th');

/* ---------- Storage ---------- */
const LS = 'astral-commonplace-notes';
function localStore(){
  const read = () => { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch { return []; } };
  let cache = read();
  const flush = () => { try { localStorage.setItem(LS, JSON.stringify(cache)); } catch {} setNotes(cache.slice()); };
  setTimeout(() => setNotes(cache.slice()), 0);
  return {
    mode: 'local',
    put: async n => { const i = cache.findIndex(x => x.id === n.id); if (i < 0) cache.push(n); else cache[i] = n; flush(); },
    del: async id => { cache = cache.filter(x => x.id !== id); flush(); },
  };
}
async function cloudStore(){
  if (!window.claude || !window.claude.use) return null;
  let db, user;
  try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch { return null; }
  if (!db || !user) return null;
  let uid = null; try { uid = await user.id(); } catch {}
  if (!uid) return null;
  const col = db.collection('data/users/' + uid);
  const timer = setTimeout(() => { if (!S.ready) setStatus('Your archive can’t be reached yet. Check your connection.'); }, 10000);
  col.onSnapshot(snap => {
    if (!snap.metadata.fromCache){ clearTimeout(timer); }
    setNotes(snap.docs.filter(d => d.exists).map(d => d.data()));
    if (!snap.metadata.fromCache) setStatus('');
  }, e => { clearTimeout(timer); setStatus(e.code === 'revoked' ? 'This page can no longer reach your archive.' : 'Your archive stopped syncing. Reopen the page to reconnect.'); });
  const run = async (fn) => {
    try { await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable'){ await new Promise(r => setTimeout(r, 400 + Math.random()*600)); try { await fn(); return; } catch (e2) { e = e2; } }
      toast(e && e.code === 'quota_exceeded' ? 'The archive is full. Delete a few old entries, then try again.' : e && e.code === 'invalid_argument' ? 'You can view this archive but not write to it.' : 'That didn’t save. Check your connection and try again.');
    }
  };
  return {
    mode: 'cloud',
    put: n => run(() => col.doc(n.id).set(JSON.parse(JSON.stringify(n)))),
    del: id => run(() => col.doc(id).delete()),
  };
}
function setNotes(list){ S.notes = list; S.ready = true; render(); checkReminders(); }
function setStatus(t){ $('#status').textContent = t; }

/* ---------- Actions ---------- */
async function inscribe(){
  const raw = $('#entry').value; const p = parse(raw); if (!p || !S.store) return;
  const now = Date.now();
  if (p.kind === 'list'){
    if (!p.items.length) return;
    const existing = S.notes.find(n => n.kind === 'list' && n.name === p.name && !n.archived);
    if (existing){
      const next = { ...existing, items: existing.items.concat(p.items.map(t => ({ t, done:false }))), updated: now };
      await S.store.put(next); toast(`Added ${p.items.length} to ${p.name}.`);
    } else {
      await S.store.put({ id:newId(), kind:'list', name:p.name, items:p.items.map(t => ({ t, done:false })), tags:[p.name], pinned:false, archived:false, created:now });
      toast(`Started the ${p.name} list.`);
    }
  } else {
    const n = { id:newId(), kind:p.kind, text:p.text, tags:p.tags, pinned:p.pinned, archived:false, created:now };
    if (p.kind === 'link') n.url = p.url;
    if (p.kind === 'reminder'){ n.due = p.due; n.repeat = p.repeat; n.sent = false; }
    await S.store.put(n);
    if (p.warn) toast(p.warn);

  }

}
function updatePreview(){
  const p = parse($('#entry').value); const el = $('#preview');
  if (!p){ el.innerHTML = ''; return; }
  if (p.kind === 'list'){
    const ex = S.notes.find(n => n.kind === 'list' && n.name === p.name && !n.archived);
    el.innerHTML = `${ex ? 'Adds' : 'Starts a list:'} <b>${esc(p.name)}</b> · ${p.items.length} item${p.items.length === 1 ? '' : 's'}`; return;
  }
  const bits = [];
  if (p.kind === 'reminder') bits.push(`Reminder for <b>${esc(fmtWhen(p.due))}</b>${p.repeat ? ' · ' + repLabel(p.repeat) : ''}`);
  else if (p.warn) bits.push('No time found yet, so this stays a note');
  else if (p.kind === 'link') bits.push(`Saves a link from <b>${esc(host(p.url))}</b>`);
  if (p.tags.length) bits.push('Filed under ' + p.tags.map(t => `<b>${esc(t)}</b>`).join(', '));
  if (p.pinned) bits.push('<b>Pinned</b>');

}

let audioCtx = null;
function unlockAudio(){ try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch {} }
function chime(){
  if (!audioCtx) return;
  try {
    [880, 1318.5, 1760].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + i * .18;
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + 1.4);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 1.5);
    });
  } catch {}
}
const fired = new Set();
function checkReminders(){
  if (!S.store) return;
  const now = Date.now();
  S.notes.forEach(n => {
    if (n.kind !== 'reminder' || n.sent || n.archived || n.due > now) return;
    const key = n.id + ':' + n.due; if (fired.has(key)) return; fired.add(key);
    const late = now - n.due > 5 * 6e4;
    toast((late ? 'Missed while you were away: ' : '') + n.text, true);
    if (!late) chime();
    if (n.repeat) S.store.put({ ...n, due: nextOccurrence(n.repeat, new Date(Math.max(now, n.due + 1000))).getTime() });
    else S.store.put({ ...n, sent: true });
  });
}

    dpr = Math.min(2, window.devicePixelRatio || 1); w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed = 7; stars = Array.from({ length: Math.round(w * h / 5200) }, () => ({ x: rnd()*w, y: rnd()*h, r: rnd()*1.1 + .2, p: rnd()*6.28, s: rnd()*.8 + .2 }));
    lines = [];
    for (let c = 0; c < 4; c++){ // a few faint constellations
      const cx = rnd()*w, cy = rnd()*h*.9, pts = Array.from({ length: 5 }, () => ({ x: cx + (rnd()-.5)*220, y: cy + (rnd()-.5)*160 }));
      lines.push(pts);
    }
  }
  function draw(t){
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w*.8, -h*.1, 0, w*.8, -h*.1, h*1.1); g.addColorStop(0, 'rgba(60,52,110,.35)'); g.addColorStop(1, 'rgba(13,16,32,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(201,164,92,.12)'; ctx.lineWidth = .7;
    lines.forEach(pts => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
      pts.forEach(p => { ctx.fillStyle = 'rgba(234,223,198,.55)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, 6.28); ctx.fill(); }); });
    stars.forEach(s => { const a = reduce ? .6 : .35 + .45 * (0.5 + 0.5 * Math.sin(t / 1000 * s.s + s.p)); ctx.fillStyle = `rgba(234,223,198,${a.toFixed(3)})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill(); });
    if (!reduce) requestAnimationFrame(draw);
  }
  size(); addEventListener('resize', () => { size(); if (reduce) draw(0); }); requestAnimationFrame(draw);
}

/* ---------- Events ---------- */
$('#save').onclick = inscribe;
$('#entry').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); inscribe(); } });
$('#entry').addEventListener('input', updatePreview);
$('#hints').addEventListener('click', e => {
  const b = e.target.closest('[data-ins]'); if (!b) return;
  const ta = $('#entry'), ins = b.dataset.ins;
  if (ins.startsWith('#') && !ins.startsWith(' ')){ ta.value = ins + ta.value; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  else if (ins.startsWith('remind')){ ta.value = ins; ta.focus(); ta.setSelectionRange(13, 13); }
  else { ta.value = ta.value.replace(/\s+$/,'') + ins; ta.focus(); }
  updatePreview();
});
$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (!b) return; S.view = b.dataset.view; S.tag = null;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b)); render();
});
$('#tags').addEventListener('click', e => { const b = e.target.closest('[data-tag]'); if (!b) return; S.tag = b.dataset.tag || null; render(); });
$('#oracleBtn').onclick = openOracle;
$('#moreBtn').onclick = openAlmanac;
$('#out').addEventListener('change', e => {
  const cb = e.target.closest('[data-tick]'); if (!cb) return;
  const n = S.notes.find(x => x.id === cb.closest('.card').dataset.id); if (!n) return;
  const items = n.items.map((it, i) => i === +cb.dataset.tick ? { ...it, done: cb.checked } : it);
  S.store.put({ ...n, items });
});
$('#out').addEventListener('submit', e => {
  const f = e.target.closest('[data-add]'); if (!f) return; e.preventDefault();
  const n = S.notes.find(x => x.id === f.closest('.card').dataset.id); const v = f.querySelector('input').value.trim(); if (!n || !v) return;
  S.store.put({ ...n, items: n.items.concat(v.split(',').map(t => ({ t: t.trim(), done:false })).filter(i => i.t)) });
});
$('#out').addEventListener('click', e => {
  if (e.target.closest('a, input, label, form')) return;
  const c = e.target.closest('.card:not(.example)'); if (c) openNote(c.dataset.id);
});
$('#out').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.card')) openNote(e.target.dataset.id); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('pointerdown', unlockAudio, { once: true });

/* ---------- Boot ---------- */
renderEphemeris(); setInterval(renderEphemeris, 6e4); sky(); render();
setInterval(checkReminders, 15000);
(async () => {
  const cloud = await cloudStore();
  S.store = cloud || localStore();
  if (cloud) render();
})();
window.__parse = parse; // handy for testing in the console
})();
</script>
